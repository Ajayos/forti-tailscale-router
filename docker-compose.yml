version: '3.8'

services:
  forti-router:
    build: .
    container_name: forti-tailscale-router
    privileged: true
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
    volumes:
      - tailscale_data:/var/lib/tailscale
    restart: unless-stopped

volumes:
  tailscale_data:
